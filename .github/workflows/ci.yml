# Builds and tests PlainOldSynth on Linux x86-64 (two configurations) and on macOS arm64.
#
# One macOS job only: GitHub bills macOS runners at 10x the Linux rate while this repository is
# private.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # The default configuration, which is what the README's build instructions produce. This includes
  # the VST3 wrapper, so it is also the job that exercises the vendored VST3 SDK on Linux.
  default:
    name: linux-x86_64 (CLAP + VST3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}   # uw-core, dpf and pugl are private

      # The same set the README's Build section lists. DPF's pugl/NanoVG UI needs X11 + GL headers;
      # the extra xcb/xkb/fontconfig packages are what the vendored VST3 SDK looks for on Linux.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # One package list for every Unlikelyware project, as in BUILDING.md
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb1-dev libx11-xcb-dev libxcb-util-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libasound2-dev libjack-jackd2-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev

      # fetch_deps.sh's own `git submodule` clones don't get checkout's token, so hand it to git
      # for the private repos (uw-core, dpf and its pugl).
      - name: Credentials for the private submodules
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/erickampman/".insteadOf \
            "https://github.com/erickampman/"
      # Dependencies are pinned submodules (see .gitmodules). fetch_deps.sh initialises them, including
      # only the four nested vst3sdk submodules this project needs rather than all seven, then applies
      # the one local patch under patches/.
      - name: Fetch pinned dependency submodules
        run: tools/fetch_deps.sh

      - name: Configure
        run: cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The core plugin on its own, with both wrappers off. This job exists so that a Linux problem inside
  # the vendored VST3 SDK cannot masquerade as "PlainOldSynth does not build on Linux": if `default`
  # is red and this one is green, the fault is the wrapper, and -DPOS_BUILD_VST3=OFF is the workaround.
  clap-only:
    name: linux-x86_64 (CLAP only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}   # uw-core, dpf and pugl are private

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # One package list for every Unlikelyware project, as in BUILDING.md
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb1-dev libx11-xcb-dev libxcb-util-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libasound2-dev libjack-jackd2-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev

      # fetch_deps.sh's own `git submodule` clones don't get checkout's token, so hand it to git
      # for the private repos (uw-core, dpf and its pugl).
      - name: Credentials for the private submodules
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/erickampman/".insteadOf \
            "https://github.com/erickampman/"
      - name: Fetch pinned dependency submodules
        run: tools/fetch_deps.sh

      - name: Configure (no wrappers)
        run: >
          cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Release
          -DPOS_BUILD_VST3=OFF -DPOS_BUILD_AUV2=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The default configuration on macOS, as BUILDING.md's steps produce it: CLAP, VST3 and AUv2.
  macos:
    name: macos-26 (CLAP + VST3 + AUv2)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}   # uw-core, dpf and pugl are private

      # fetch_deps.sh's own `git submodule` clones don't get checkout's token, so hand it to git
      # for the private repos (uw-core, dpf and its pugl).
      - name: Credentials for the private submodules
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/erickampman/".insteadOf \
            "https://github.com/erickampman/"
      - name: Fetch pinned dependency submodules
        run: tools/fetch_deps.sh

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
